name: CI

# Runs on pull requests and on pushes to any branch except main. It never deploys:
# GitHub Pages keeps serving main exactly as today.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit, property and parity tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Committed app/ matches the source
        run: |
          if ! git diff --quiet -- app/ || [ -n "$(git status --porcelain -- app/)" ]; then
            echo "::error::app/ is out of date. Run 'npm run build' and commit app/."
            git status --short -- app/
            exit 1
          fi
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end tests (desktop Chromium + iPhone WebKit)
        run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
